<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Emotion Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e293b, #0f172a 70%);
            color: #f8fafc;
            line-height: 1.6;
            min-height: 100vh;
        }

        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
            max-width: 600px;
            margin: 0 auto;
        }

        .hero > div {
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle {
            font-size: 16px;
            color: #94a3b8;
            margin-bottom: 32px;
            max-width: 90%;
        }

        .card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .file-input {
            position: relative;
        }

        .file-input input {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .file-input label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            border: 2px dashed rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.4);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 15px;
            color: #94a3b8;
            font-weight: 500;
        }

        .file-input:hover label, .file-input label.drag-over {
            border-color: #60a5fa;
            color: #e2e8f0;
            background: rgba(96, 165, 250, 0.05);
            transform: translateY(-2px);
        }

        .file-input label.has-file {
            border-style: solid;
            border-color: #60a5fa;
            color: #fff;
            background: rgba(96, 165, 250, 0.1);
        }

        .btn {
            padding: 14px 24px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 24px;
            padding: 20px;
            background: linear-gradient(rgba(15, 23, 42, 0.5), rgba(15, 23, 42, 0.8));
            border: 1px solid rgba(96, 165, 250, 0.2);
            border-radius: 12px;
            text-align: center;
        }

        .result h3 {
            font-size: 24px;
            font-weight: 700;
            color: #60a5fa;
            margin-bottom: 8px;
            text-transform: capitalize;
        }

        .confidence-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 12px;
            overflow: hidden;
            position: relative;
        }

        .confidence-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #60a5fa, #c084fc);
            border-radius: 4px;
            transition: width 1s ease-out;
        }

        .result p {
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
        }

        .preview {
            margin-top: 24px;
            width: 100%;
            max-height: 350px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .error {
            margin-top: 16px;
            padding: 14px 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }

        @media (max-width: 900px) {
            .hero {
                gap: 32px;
            }
            .page {
                padding: 40px 20px;
            }
            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="hero">
            <div>
                <h1>Emotion Detection</h1>
                <p class="subtitle">Upload a photo and get emotion predictions using AI. Works best with clear, frontal face photos.</p>
                <div class="card">
                    <form class="form-group" method="POST" action="/predict" enctype="multipart/form-data">
                        <div class="file-input">
                            <input type="file" id="imageInput" name="image" accept="image/*" required>
                            <label for="imageInput" id="drop-zone">
                                <div style="display:flex; flex-direction:column; align-items:center; gap:8px;">
                                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #60a5fa;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                    <span id="file-name">Choose an image or drop it here</span>
                                </div>
                            </label>
                        </div>
                        <button class="btn" type="submit">Analyze</button>
                    </form>
                    {% if error %}
                    <div class="error">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <span>{{ error }}</span>
                    </div>
                    {% endif %}
                    {% if emotion %}
                    <div class="result">
                        <h3>{{ emotion }}</h3>
                        <p>Confidence: {{ confidence }}%</p>
                        <div class="confidence-bar">
                            <div class="confidence-fill" data-width="{{ confidence }}"></div>
                        </div>
                    </div>
                    <img class="preview" src="{{ url_for('static', filename=image) }}" alt="Uploaded image">
                    {% endif %}
                </div>
            </div>
        </section>
    </main>

    <script>
        const fileInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('drop-zone');
        const fileNameSpan = document.getElementById('file-name');
        
        // Update label when file is selected
        fileInput.addEventListener('change', (e) => {
            if (fileInput.files.length > 0) {
                fileNameSpan.textContent = fileInput.files[0].name;
                dropZone.classList.add('has-file');
            } else {
                fileNameSpan.textContent = 'Choose an image or drop it here';
                dropZone.classList.remove('has-file');
            }
        });

        // Drag and drop events
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('drag-over');
        }

        function unhighlight(e) {
            dropZone.classList.remove('drag-over');
        }

        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            if (files && files.length > 0) {
                fileInput.files = files;
                // Trigger change event to update text
                fileInput.dispatchEvent(new Event('change'));
            }
        }

        // Animate confidence bar on load
        window.addEventListener('DOMContentLoaded', () => {
            const confidenceFill = document.querySelector('.confidence-fill');
            if (confidenceFill) {
                const targetWidth = confidenceFill.getAttribute('data-width');
                if (targetWidth) {
                    // Small delay ensures the transition animation plays smoothly after page load
                    setTimeout(() => {
                        confidenceFill.style.width = targetWidth + '%';
                    }, 50);
                }
            }
        });
    </script>
</body>
</html>
